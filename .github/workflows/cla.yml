name: CLA Assistant

# Requires a repository secret named CLA_BOT_PAT: a GitHub personal access token with
# `repo` scope (classic) or Contents + Pull requests read/write (fine-grained), belonging to
# an account with write access to this repo. The bot uses it to comment on pull requests and to
# commit signature records; the default GITHUB_TOKEN can't do both reliably. Create it under
# GitHub Settings > Developer settings > Personal access tokens, then add it as a secret at
# Settings > Secrets and variables > Actions > New repository secret in this repo.
#
# See CLA.md for the agreement text. Signed usernames are recorded in signatures/cla.json on
# the default branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_PAT }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/invarislabs/invaris-agentsec/blob/main/CLA.md
          branch: main
          allowlist: dependabot[bot],invarislabs
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: |
            Thanks for the pull request! Before it can be merged, please read [CLA.md](https://github.com/invarislabs/invaris-agentsec/blob/main/CLA.md)
            and reply to this comment with the exact text below to confirm you agree:

            > I have read the CLA Document and I hereby sign the CLA
