name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # The LangChain/LangGraph integration tests need the framework, so they run in their own job.
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,langchain]"
      - run: pytest tests/test_langchain_integration.py -W ignore

  # The hardened reference agent must pass, and the action must exit 0.
  agentsec-passes-on-safe-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          policy: examples/vulnerable_rag_agent/agentsec.yaml
          start-command: python examples/vulnerable_rag_agent/server.py --safe --port 8000
          wait-for-url: http://127.0.0.1:8000/
          artifact-name: agentsec-safe-agent

  # The vulnerable reference agent must fail the job. This guards the whole detection and gating path.
  agentsec-fails-on-vulnerable-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: vulnerable
        uses: ./
        continue-on-error: true
        with:
          policy: examples/vulnerable_rag_agent/agentsec.yaml
          start-command: python examples/vulnerable_rag_agent/server.py --port 8000
          wait-for-url: http://127.0.0.1:8000/
          artifact-name: agentsec-vulnerable-agent
      - name: The vulnerable agent must be reported
        if: steps.vulnerable.outputs.exit-code != '1'
        run: |
          echo "::error::Expected exit code 1 from the vulnerable agent, got '${{ steps.vulnerable.outputs.exit-code }}'"
          exit 1

  agentsec-rag-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          policy: examples/rag_agent/agentsec.yaml
          start-command: python examples/rag_agent/server.py --safe --port 8100
          wait-for-url: http://127.0.0.1:8100/
          artifact-name: agentsec-rag-agent

  # Regression comparison: a clean baseline run, then a vulnerable run compared against it.
  # The comparison must find new findings and fail the job. pr-comment is off because this
  # workflow itself runs on real pull requests and must not post a comment on them.
  agentsec-baseline-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: baseline
        uses: ./
        with:
          policy: examples/vulnerable_rag_agent/agentsec.yaml
          start-command: python examples/vulnerable_rag_agent/server.py --safe --port 8000
          wait-for-url: http://127.0.0.1:8000/
          out: .agentsec/baseline
          artifact-name: agentsec-comparison-baseline
      - id: compared
        uses: ./
        continue-on-error: true
        with:
          policy: examples/vulnerable_rag_agent/agentsec.yaml
          start-command: python examples/vulnerable_rag_agent/server.py --port 8000
          wait-for-url: http://127.0.0.1:8000/
          baseline-report: ${{ steps.baseline.outputs.report-dir }}/report.json
          compare-fail-on: high
          pr-comment: "false"
          artifact-name: agentsec-comparison-head
      - name: The comparison must report regressions and fail the job
        if: steps.compared.outputs.compare-exit-code != '1'
        run: |
          echo "::error::Expected compare-exit-code 1, got '${{ steps.compared.outputs.compare-exit-code }}'"
          exit 1
