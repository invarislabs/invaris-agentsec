name: Invaris AgentSec
description: Adversarial security testing for AI agents. Runs the AgentSec suite, uploads the reports and fails the job on findings.
author: Invaris Labs

inputs:
  policy:
    description: Path to the policy file, relative to working-directory.
    default: agentsec.yaml
  fail-on:
    description: Fail the job if a finding at or above this severity exists (critical, high, medium, low or none).
    default: low
  seed:
    description: Seed for reproducible scenarios.
    default: "0"
  formats:
    description: Report formats, comma-separated (json, html, markdown, sarif). Add sarif to upload findings to GitHub Code Scanning; see docs/github-actions.md.
    default: json,html,markdown
  judge:
    description: Run the model-assisted evaluators configured under `judge:` in the policy.
    default: "false"
  start-command:
    description: Shell command that starts the agent under test. It is run in the background and stopped after the tests.
    default: ""
  wait-for-url:
    description: URL to poll until the agent answers HTTP (any status counts). Only used with start-command.
    default: ""
  wait-timeout:
    description: Seconds to wait for wait-for-url.
    default: "60"
  working-directory:
    description: Directory to run in.
    default: .
  out:
    description: Report directory, relative to working-directory.
    default: .agentsec
  python-version:
    description: Python version to set up. Leave empty to use the runner's Python.
    default: "3.11"
  package:
    description: What to pip install. Empty installs the copy of AgentSec from this action's own repository. Example, invaris-agentsec==0.2.0.
    default: ""
  extra-args:
    description: Extra arguments passed to `agentsec test`, for example "-s prompt_injection".
    default: ""
  baseline-report:
    description: >-
      Path to an earlier report.json to compare this run against (for example one downloaded with
      actions/download-artifact, or produced by an earlier step of the same workflow). When set,
      `agentsec compare` runs after the suite and its result can fail the job; see docs/github-actions.md.
    default: ""
  compare-fail-on:
    description: Fail the job if a new or worsened finding at or above this severity exists (critical, high, medium, low or none). Only used with baseline-report.
    default: low
  pr-comment:
    description: On a pull_request event, post (or update) a comment with the baseline-report comparison. Only used with baseline-report.
    default: "true"
  github-token:
    description: Token used to post the pull-request comment. Defaults to the job's own token.
    default: ""
  comment-marker:
    description: Distinguishes this action's pull-request comment from others in the same workflow, for example when it runs more than once in a matrix.
    default: default
  upload-artifact:
    description: Upload the report directory as a workflow artifact.
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact. Use a unique name per matrix entry.
    default: agentsec-report

outputs:
  exit-code:
    description: Exit code of `agentsec test` (0 clean, 1 findings, 2 error).
    value: ${{ steps.run.outputs.exit-code }}
  findings:
    description: Number of findings.
    value: ${{ steps.run.outputs.findings }}
  scenarios:
    description: Number of scenarios executed.
    value: ${{ steps.run.outputs.scenarios }}
  report-dir:
    description: Directory containing the reports.
    value: ${{ steps.run.outputs.report-dir }}
  compare-exit-code:
    description: Exit code of the baseline-report comparison (0 clean, 1 regressions, 2 error, empty if no baseline-report was given).
    value: ${{ steps.compare.outputs.compare-exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AgentSec
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "${PACKAGE:-$ACTION_PATH}"

    - name: Start the agent
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        START_COMMAND: ${{ inputs.start-command }}
        WAIT_URL: ${{ inputs.wait-for-url }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
      run: bash "${{ github.action_path }}/action/start-agent.sh"

    - name: Run AgentSec
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POLICY: ${{ inputs.policy }}
        FAIL_ON: ${{ inputs.fail-on }}
        SEED: ${{ inputs.seed }}
        FORMATS: ${{ inputs.formats }}
        OUT: ${{ inputs.out }}
        JUDGE: ${{ inputs.judge }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "${{ github.action_path }}/action/run-agentsec.sh"

    - name: Stop the agent
      if: always()
      shell: bash
      run: bash "${{ github.action_path }}/action/stop-agent.sh"

    - name: Compare against the baseline report
      id: compare
      if: always() && inputs.baseline-report != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASELINE_REPORT: ${{ inputs.baseline-report }}
        CURRENT_REPORT: ${{ inputs.out }}/report.json
        COMPARE_FAIL_ON: ${{ inputs.compare-fail-on }}
      run: bash "${{ github.action_path }}/action/compare-report.sh"

    - name: Comment on the pull request
      if: always() && inputs.baseline-report != '' && inputs.pr-comment == 'true'
      shell: bash
      env:
        SUMMARY_PATH: ${{ steps.compare.outputs.compare-summary-path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        COMMENT_MARKER_KEY: ${{ inputs.comment-marker }}
      run: bash "${{ github.action_path }}/action/pr-comment.sh"

    - name: Upload reports
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.out }}
        if-no-files-found: ignore

    - name: Fail the job if AgentSec found issues
      shell: bash
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        COMPARE_EXIT_CODE: ${{ steps.compare.outputs.compare-exit-code }}
      run: |
        fail=0
        if [ "${EXIT_CODE:-1}" != "0" ]; then
          echo "::error title=AgentSec::AgentSec exited with code ${EXIT_CODE:-unknown} (see the annotations and the job summary above)"
          fail=1
        fi
        if [ -n "${COMPARE_EXIT_CODE:-}" ] && [ "${COMPARE_EXIT_CODE:-0}" != "0" ]; then
          echo "::error title=AgentSec compare::agentsec compare exited with code ${COMPARE_EXIT_CODE} (regressions against the baseline, or a comparison error)"
          fail=1
        fi
        if [ "$fail" != "0" ]; then
          exit 1
        fi
