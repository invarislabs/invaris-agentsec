[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invaris-agentsec"
version = "0.2.0"
description = "Adversarial security and reliability testing for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.entry-points.pytest11]
agentsec = "agentsec.pytest_plugin"

[project.scripts]
agentsec = "agentsec.cli.main:main"

[tool.setuptools.packages.find]
include = ["agentsec*"]

[tool.setuptools.package-data]
"agentsec.policies" = ["*.json"]
"agentsec.traces" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
